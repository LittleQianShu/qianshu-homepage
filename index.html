<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>千树</title>
    <style>
        body {
            font-family: sans-serif;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(160deg, #1a1033 0%, #3d1b5c 50%, #0d3b4c 100%);
            padding-bottom: 40px;
            overflow-x: hidden;
        }
        .side {
            position: fixed;
            top: 0;
            bottom: 0;
            width: 180px;
            pointer-events: none;
            z-index: 0;
        }
        .side-left { left: 0; }
        .side-right { right: 0; }
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(1px);
        }
        .orb-a {
            width: 90px;
            height: 90px;
            left: 28px;
            top: 12%;
            background: radial-gradient(circle at 30% 30%, #ffb6e3, #ff4d9a 55%, transparent 70%);
            box-shadow: 0 0 40px #ff4d9a;
            animation: floaty 6s ease-in-out infinite;
        }
        .orb-b {
            width: 54px;
            height: 54px;
            left: 70px;
            top: 42%;
            background: radial-gradient(circle at 30% 30%, #c9b6ff, #7a4dff 55%, transparent 70%);
            box-shadow: 0 0 28px #7a4dff;
            animation: floaty 7s ease-in-out infinite reverse;
        }
        .orb-c {
            width: 36px;
            height: 36px;
            left: 40px;
            top: 72%;
            background: radial-gradient(circle at 30% 30%, #fff, #7ae0ff 55%, transparent 70%);
            box-shadow: 0 0 22px #7ae0ff;
            animation: floaty 5s ease-in-out infinite;
        }
        .ring {
            position: absolute;
            border-radius: 50%;
            border: 2px solid rgba(122, 224, 255, 0.45);
            box-shadow: 0 0 18px rgba(122, 224, 255, 0.35);
        }
        .ring-a {
            width: 120px;
            height: 120px;
            right: 24px;
            top: 16%;
            animation: spin 12s linear infinite;
        }
        .ring-b {
            width: 72px;
            height: 72px;
            right: 48px;
            top: 22%;
            border-color: rgba(255, 140, 200, 0.5);
            animation: spin 8s linear infinite reverse;
        }
        .orb-d {
            width: 70px;
            height: 70px;
            right: 50px;
            top: 48%;
            background: radial-gradient(circle at 30% 30%, #b8fff0, #2ee6c2 55%, transparent 70%);
            box-shadow: 0 0 36px #2ee6c2;
            animation: floaty 6.5s ease-in-out infinite;
        }
        .orb-e {
            width: 42px;
            height: 42px;
            right: 36px;
            top: 74%;
            background: radial-gradient(circle at 30% 30%, #ffe566, #ff9f1a 55%, transparent 70%);
            box-shadow: 0 0 24px #ff9f1a;
            animation: floaty 5.5s ease-in-out infinite reverse;
        }
        .spark {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 10px #fff;
            animation: twinkle 2.4s ease-in-out infinite;
        }
        .spark-1 { left: 46px; top: 28%; animation-delay: 0.2s; }
        .spark-2 { left: 110px; top: 58%; animation-delay: 0.8s; }
        .spark-3 { right: 90px; top: 38%; animation-delay: 0.4s; }
        .spark-4 { right: 40px; top: 64%; animation-delay: 1.1s; }
        .stage {
            position: relative;
            z-index: 1;
        }
        .name {
            font-size: 42px;
            font-weight: bold;
            text-align: center;
            margin-top: 50px;
            cursor: pointer;
            background: linear-gradient(90deg, #ff8cc8, #7ae0ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 12px rgba(255, 140, 200, 0.7));
        }
        .name:hover {
            filter: drop-shadow(0 0 20px rgba(122, 224, 255, 0.9));
        }
        .hi {
            text-align: center;
            color: #c9e9ff;
            min-height: 24px;
            margin: 8px 0 20px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .hi.show {
            opacity: 1;
        }
        .info {
            width: 320px;
            margin: 12px auto;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 14px;
            text-align: center;
            color: #f4edff;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
            cursor: pointer;
            transition: transform 0.2s, background 0.2s, box-shadow 0.2s, border-color 0.2s;
            animation: popin 0.5s ease both;
        }
        .info:nth-child(3) { animation-delay: 0.05s; }
        .info:nth-child(4) { animation-delay: 0.10s; }
        .info:nth-child(5) { animation-delay: 0.15s; }
        .info:nth-child(6) { animation-delay: 0.20s; }
        .info:nth-child(7) { animation-delay: 0.25s; }
        .info:nth-child(8) { animation-delay: 0.30s; }
        .info:hover {
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.22);
        }
        .info.on {
            transform: scale(1.06);
            border-color: #7ae0ff;
            background: rgba(122, 224, 255, 0.22);
            box-shadow: 0 0 24px rgba(122, 224, 255, 0.45);
        }
        @keyframes popin {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes floaty {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-18px); }
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.7); }
            50% { opacity: 1; transform: scale(1.3); }
        }
        @media (max-width: 720px) {
            .side { display: none; }
        }
    </style>
</head>
<body>
    <div class="side side-left">
        <div class="orb orb-a"></div>
        <div class="orb orb-b"></div>
        <div class="orb orb-c"></div>
        <div class="spark spark-1"></div>
        <div class="spark spark-2"></div>
    </div>
    <div class="side side-right">
        <div class="ring ring-a"></div>
        <div class="ring ring-b"></div>
        <div class="orb orb-d"></div>
        <div class="orb orb-e"></div>
        <div class="spark spark-3"></div>
        <div class="spark spark-4"></div>
    </div>
    <div class="stage">
        <div class="name">千树</div>
        <div class="hi">点名字会换色，点卡片会亮起来</div>
        <div class="info">星座：巨蟹座</div>
        <div class="info">爱好：羽毛球，编程，看电视</div>
        <div class="info">性别：男</div>
        <div class="info">年龄：九岁</div>
        <div class="info">家庭住址：淮安</div>
        <div class="info">家庭成员：爸爸，妈妈，千树</div>
    </div>
    <script>
        const name = document.querySelector(".name");
        const hi = document.querySelector(".hi");
        const colors = [
            "linear-gradient(90deg, #ff8cc8, #7ae0ff)",
            "linear-gradient(90deg, #ffe566, #ff6b9d)",
            "linear-gradient(90deg, #7cffb2, #7ae0ff)"
        ];
        const hellos = ["你好，我是千树！", "点卡片还能再亮一次～", "欢迎来到我的主页"];
        let i = 0;

        name.onclick = function () {
            i = i + 1;
            if (i >= colors.length) {
                i = 0;
            }
            name.style.background = colors[i];
            name.style.backgroundClip = "text";
            name.style.webkitBackgroundClip = "text";
            hi.textContent = hellos[i];
            hi.classList.add("show");
        };

        const cards = document.querySelectorAll(".info");
        for (let n = 0; n < cards.length; n = n + 1) {
            cards[n].onclick = function () {
                cards[n].classList.toggle("on");
            };
        }
    </script>
</body>
</html>
