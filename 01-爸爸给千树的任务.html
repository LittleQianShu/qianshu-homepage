<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>千树</title>
    <style>
        body {
            font-family: sans-serif;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(160deg, #1a1033 0%, #3d1b5c 50%, #0d3b4c 100%);
            padding-bottom: 40px;
            overflow-x: hidden;
        }
        #dust {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }
        .nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 6;
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 28px;
            background: rgba(10, 6, 28, 0.55);
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
        }
        .nav button {
            border: 0;
            background: transparent;
            color: #f4edff;
            font-size: 16px;
            cursor: pointer;
            padding: 6px 14px;
            border-radius: 999px;
        }
        .nav button.on {
            background: rgba(122, 224, 255, 0.22);
            box-shadow: 0 0 16px rgba(122, 224, 255, 0.35);
        }
        .side {
            display: none;
            position: fixed;
            top: 70px;
            bottom: 16px;
            width: 210px;
            z-index: 2;
        }
        body.play .side { display: block; }
        .side-left { left: 12px; }
        .side-right { right: 12px; }
        .game {
            height: 100%;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.22);
            background: rgba(8, 4, 24, 0.45);
            box-shadow: 0 0 28px rgba(122, 224, 255, 0.18);
            overflow: hidden;
            position: relative;
        }
        .game-title {
            text-align: center;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            padding: 10px 8px 0;
            text-shadow: 0 0 10px #7ae0ff;
        }
        .game-score {
            text-align: center;
            color: #7ae0ff;
            font-size: 12px;
            margin-top: 4px;
        }
        .arena {
            position: absolute;
            left: 8px;
            right: 8px;
            top: 52px;
            bottom: 8px;
        }
        .bubble {
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 16px currentColor;
        }
        .star {
            position: absolute;
            width: 14px;
            height: 14px;
            background: #ffe566;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            filter: drop-shadow(0 0 8px #ffe566);
        }
        .paddle {
            position: absolute;
            bottom: 6px;
            width: 56px;
            height: 10px;
            border-radius: 8px;
            background: linear-gradient(90deg, #7ae0ff, #ff8cc8);
            box-shadow: 0 0 14px #7ae0ff;
        }
        .stage {
            position: relative;
            z-index: 1;
            padding-top: 24px;
        }
        .name {
            font-size: 42px;
            font-weight: bold;
            text-align: center;
            margin-top: 50px;
            cursor: pointer;
            background: linear-gradient(90deg, #ff8cc8, #7ae0ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 12px rgba(255, 140, 200, 0.7));
        }
        .name:hover {
            filter: drop-shadow(0 0 20px rgba(122, 224, 255, 0.9));
        }
        .hi {
            text-align: center;
            color: #c9e9ff;
            min-height: 24px;
            margin: 8px 0 20px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .hi.show { opacity: 1; }
        .info {
            width: 320px;
            margin: 12px auto;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 14px;
            text-align: center;
            color: #f4edff;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
            cursor: pointer;
            transition: transform 0.2s, background 0.2s, box-shadow 0.2s, border-color 0.2s;
            animation: popin 0.5s ease both;
        }
        .info:nth-child(3) { animation-delay: 0.05s; }
        .info:nth-child(4) { animation-delay: 0.10s; }
        .info:nth-child(5) { animation-delay: 0.15s; }
        .info:nth-child(6) { animation-delay: 0.20s; }
        .info:nth-child(7) { animation-delay: 0.25s; }
        .info:nth-child(8) { animation-delay: 0.30s; }
        .info:hover {
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.22);
        }
        .info.on {
            transform: scale(1.06);
            border-color: #7ae0ff;
            background: rgba(122, 224, 255, 0.22);
            box-shadow: 0 0 24px rgba(122, 224, 255, 0.45);
        }
        @keyframes popin {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .works {
            display: none;
            position: relative;
            z-index: 1;
            padding-top: 80px;
        }
        body.page-works .works { display: block; }
        body.page-works .stage { display: none; }
        .works-title {
            text-align: center;
            color: #f4edff;
            font-size: 22px;
            margin-bottom: 8px;
            text-shadow: 0 0 12px rgba(122, 224, 255, 0.45);
        }
        .works-hi {
            text-align: center;
            color: #c9e9ff;
            margin-bottom: 18px;
        }
        .work {
            width: 320px;
            margin: 12px auto;
            padding: 16px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 14px;
            text-align: center;
            color: #f4edff;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
        }
        .work:hover {
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.22);
        }
        .work.soon {
            cursor: default;
            opacity: 0.7;
        }
        .work.soon:hover { transform: none; }
        .studio {
            display: none;
            position: relative;
            z-index: 1;
            padding: 80px 16px 24px;
            text-align: center;
            color: #f4edff;
        }
        body.in-studio .works,
        body.in-studio .stage { display: none; }
        body.lottery .studio-lottery,
        body.slider .studio-slider,
        body.page-clock .studio-clock,
        body.page-draw .studio-draw,
        body.page-color .studio-color { display: block; }
        .studio h1, .studio h2, .studio h3 {
            margin: 14px 0;
            font-weight: normal;
        }
        .studio strong {
            display: block;
            font-size: 22px;
            margin-bottom: 16px;
            text-shadow: 0 0 12px rgba(122, 224, 255, 0.45);
        }
        .studio button,
        .back {
            border: 0;
            background: rgba(122, 224, 255, 0.22);
            color: #f4edff;
            padding: 8px 16px;
            border-radius: 999px;
            cursor: pointer;
            margin: 8px 6px;
        }
        .slide-box {
            width: 320px;
            height: 200px;
            margin: 18px auto;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            box-shadow: 0 0 28px rgba(122, 224, 255, 0.25);
        }
        .clock-face {
            width: 200px;
            height: 200px;
            margin: 16px auto;
            border-radius: 50%;
            border: 4px solid #7ae0ff;
            position: relative;
            background: rgba(8, 4, 24, 0.45);
            box-shadow: 0 0 24px rgba(122, 224, 255, 0.35);
        }
        .hand {
            position: absolute;
            left: 50%;
            bottom: 50%;
            transform-origin: bottom center;
            background: #f4edff;
            border-radius: 4px;
        }
        .hand.hour { width: 6px; height: 52px; margin-left: -3px; }
        .hand.min { width: 4px; height: 72px; margin-left: -2px; }
        .hand.sec { width: 2px; height: 82px; margin-left: -1px; background: #ff8cc8; }
        .clock-dot {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 10px;
            height: 10px;
            margin: -5px 0 0 -5px;
            border-radius: 50%;
            background: #7ae0ff;
        }
        #clockText { margin-top: 10px; color: #7ae0ff; }
        #drawPad {
            display: block;
            margin: 12px auto 0;
            background: #fff8ff;
            border-radius: 12px;
            cursor: crosshair;
            box-shadow: 0 0 20px rgba(255, 140, 200, 0.25);
        }
        .pens {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 8px;
            width: 360px;
            margin: 12px auto;
        }
        .studio .pen {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.35);
            cursor: pointer;
            padding: 0;
            margin: 0;
            box-shadow: none;
        }
        .studio .pen.on {
            box-shadow: 0 0 0 3px #7ae0ff;
        }
        .sizes {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin: 0 0 12px;
        }
        .studio .size {
            width: 36px;
            height: 36px;
            padding: 0;
            margin: 0;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.35);
            background: rgba(8, 4, 24, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: none;
        }
        .studio .size.on {
            box-shadow: 0 0 0 3px #7ae0ff;
        }
        .studio .size i {
            display: block;
            border-radius: 50%;
            background: #f4edff;
        }
        .color-show {
            width: 220px;
            height: 120px;
            margin: 14px auto;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        #colorHex { font-size: 22px; letter-spacing: 1px; }
        @media (max-width: 860px) {
            body.play .side { display: none; }
        }
    </style>
</head>
<body>
    <canvas id="dust"></canvas>
    <div class="nav">
        <button type="button" id="homeBtn" class="on">首页</button>
        <button type="button" id="worksBtn">作品</button>
        <button type="button" id="gameBtn">游戏</button>
    </div>
    <div class="side side-left">
        <div class="game">
            <div class="game-title">戳泡泡</div>
            <div class="game-score" id="bubbleScore">0 分</div>
            <div class="arena" id="bubbleArena"></div>
        </div>
    </div>
    <div class="side side-right">
        <div class="game">
            <div class="game-title">接星星</div>
            <div class="game-score" id="starScore">0 分</div>
            <div class="arena" id="starArena">
                <div class="paddle" id="paddle"></div>
            </div>
        </div>
    </div>
    <div class="stage">
        <div class="name">千树</div>
        <div class="hi">点名字会换色，点卡片会亮起来</div>
        <div class="info">星座：巨蟹座</div>
        <div class="info">爱好：羽毛球，编程，看电视</div>
        <div class="info">性别：男</div>
        <div class="info">年龄：九岁</div>
        <div class="info">家庭住址：淮安</div>
        <div class="info">家庭成员：爸爸，妈妈，千树</div>
    </div>
    <div class="works">
        <div class="works-title">千树的作品</div>
        <div class="works-hi">点卡片打开作品</div>
        <div class="work" id="workLottery">随机抽奖</div>
        <div class="work" id="workSlider">随机轮播</div>
        <div class="work" id="workClock">会走的时钟</div>
        <div class="work" id="workDraw">小画板</div>
        <div class="work" id="workColor">调色盘</div>
    </div>
    <div class="studio studio-lottery">
        <button type="button" class="back" id="backFromLottery">回到作品</button>
        <strong>随机抽奖</strong>
        <h1>一等奖：<span id="one">???</span></h1>
        <h2>二等奖：<span id="two">???</span></h2>
        <h3>三等奖：<span id="three">???</span></h3>
        <button type="button" id="drawBtn">再抽一次</button>
    </div>
    <div class="studio studio-slider">
        <button type="button" class="back" id="backFromSlider">回到作品</button>
        <strong>随机轮播</strong>
        <div class="slide-box" id="slideBox">?</div>
        <button type="button" id="slideBtn">换一张</button>
    </div>
    <div class="studio studio-clock">
        <button type="button" class="back" id="backFromClock">回到作品</button>
        <strong>会走的时钟</strong>
        <div class="clock-face">
            <div class="hand hour" id="hourHand"></div>
            <div class="hand min" id="minHand"></div>
            <div class="hand sec" id="secHand"></div>
            <div class="clock-dot"></div>
        </div>
        <div id="clockText">--:--:--</div>
    </div>
    <div class="studio studio-draw">
        <button type="button" class="back" id="backFromDraw">回到作品</button>
        <strong>小画板</strong>
        <canvas id="drawPad" width="360" height="240"></canvas>
        <div class="pens">
            <button type="button" class="pen on" data-color="#5b2b8a" style="background:#5b2b8a"></button>
            <button type="button" class="pen" data-color="#ff8cc8" style="background:#ff8cc8"></button>
            <button type="button" class="pen" data-color="#ff4d4d" style="background:#ff4d4d"></button>
            <button type="button" class="pen" data-color="#ff8c32" style="background:#ff8c32"></button>
            <button type="button" class="pen" data-color="#ffe566" style="background:#ffe566"></button>
            <button type="button" class="pen" data-color="#7cffb2" style="background:#7cffb2"></button>
            <button type="button" class="pen" data-color="#00c2a8" style="background:#00c2a8"></button>
            <button type="button" class="pen" data-color="#7ae0ff" style="background:#7ae0ff"></button>
            <button type="button" class="pen" data-color="#2b6fff" style="background:#2b6fff"></button>
            <button type="button" class="pen" data-color="#c9b6ff" style="background:#c9b6ff"></button>
            <button type="button" class="pen" data-color="#8b5a2b" style="background:#8b5a2b"></button>
            <button type="button" class="pen" data-color="#888888" style="background:#888888"></button>
            <button type="button" class="pen" data-color="#222222" style="background:#222222"></button>
            <button type="button" class="pen" data-color="#ffffff" style="background:#ffffff"></button>
            <input type="color" id="drawColorPick" value="#5b2b8a" title="更多颜色">
        </div>
        <div class="sizes">
            <button type="button" class="size" data-size="2" title="细"><i style="width:6px;height:6px"></i></button>
            <button type="button" class="size on" data-size="6" title="中"><i style="width:12px;height:12px"></i></button>
            <button type="button" class="size" data-size="14" title="粗"><i style="width:20px;height:20px"></i></button>
        </div>
        <button type="button" id="clearDraw">清空</button>
    </div>
    <div class="studio studio-color">
        <button type="button" class="back" id="backFromColor">回到作品</button>
        <strong>调色盘</strong>
        <input type="color" id="colorPick" value="#ff8cc8">
        <div class="color-show" id="colorShow"></div>
        <div id="colorHex">#ff8cc8</div>
    </div>
    <script>
        const canvas = document.getElementById("dust");
        const ctx = canvas.getContext("2d");
        const dots = [];
        const mouse = { x: -9999, y: -9999 };
        const fadeOut = 40;
        const fadeIn = 130;

        function fitCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        fitCanvas();
        window.onresize = fitCanvas;

        for (let n = 0; n < 1000; n = n + 1) {
            dots.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                r: 1 + Math.random() * 2.2,
                vx: -0.25 + Math.random() * 0.5,
                vy: -0.25 + Math.random() * 0.5,
                color: ["#ff8cc8", "#7ae0ff", "#ffe566", "#c9b6ff"][n % 4],
                alpha: 0
            });
        }

        window.onmousemove = function (event) {
            mouse.x = event.clientX;
            mouse.y = event.clientY;
        };

        function drawDots() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let n = 0; n < dots.length; n = n + 1) {
                const d = dots[n];
                d.x = d.x + d.vx;
                d.y = d.y + d.vy;
                if (d.x < 0) { d.x = canvas.width; }
                if (d.x > canvas.width) { d.x = 0; }
                if (d.y < 0) { d.y = canvas.height; }
                if (d.y > canvas.height) { d.y = 0; }

                const dx = d.x - mouse.x;
                const dy = d.y - mouse.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                let want = 0.85;
                if (dist <= fadeOut) {
                    want = 0;
                } else if (dist < fadeIn) {
                    const t = (dist - fadeOut) / (fadeIn - fadeOut);
                    want = 0.85 * t * t;
                }
                const step = 0.018;
                if (want < d.alpha) {
                    d.alpha = d.alpha - step;
                    if (d.alpha < want) {
                        d.alpha = want;
                    }
                } else {
                    d.alpha = d.alpha + step;
                    if (d.alpha > want) {
                        d.alpha = want;
                    }
                }
                if (d.alpha > 0.02) {
                    ctx.beginPath();
                    ctx.fillStyle = d.color;
                    ctx.globalAlpha = d.alpha;
                    ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            ctx.globalAlpha = 1;
            requestAnimationFrame(drawDots);
        }
        drawDots();

        const homeBtn = document.getElementById("homeBtn");
        const worksBtn = document.getElementById("worksBtn");
        const gameBtn = document.getElementById("gameBtn");

        function lightNav(btn) {
            homeBtn.classList.remove("on");
            worksBtn.classList.remove("on");
            gameBtn.classList.remove("on");
            btn.classList.add("on");
        }
        function clearRooms() {
            document.body.classList.remove("play");
            document.body.classList.remove("page-works");
            document.body.classList.remove("in-studio");
            document.body.classList.remove("lottery");
            document.body.classList.remove("slider");
            document.body.classList.remove("page-clock");
            document.body.classList.remove("page-draw");
            document.body.classList.remove("page-color");
        }
        function openStudio(room, start) {
            clearRooms();
            document.body.classList.add("in-studio");
            document.body.classList.add(room);
            lightNav(worksBtn);
            if (start) {
                start();
            }
        }
        function openHome() {
            clearRooms();
            lightNav(homeBtn);
        }
        function openWorks() {
            clearRooms();
            document.body.classList.add("page-works");
            lightNav(worksBtn);
        }
        function openGames() {
            clearRooms();
            document.body.classList.add("play");
            lightNav(gameBtn);
            readySound();
        }
        function openLottery() {
            openStudio("lottery", drawPrize);
        }
        function openSlider() {
            openStudio("slider", randomSlide);
        }

        homeBtn.onclick = openHome;
        worksBtn.onclick = openWorks;
        gameBtn.onclick = openGames;
        document.getElementById("workLottery").onclick = openLottery;
        document.getElementById("workSlider").onclick = openSlider;
        document.getElementById("workClock").onclick = function () {
            openStudio("page-clock", tickClock);
        };
        document.getElementById("workDraw").onclick = function () {
            openStudio("page-draw");
        };
        document.getElementById("workColor").onclick = function () {
            openStudio("page-color", showColor);
        };
        document.getElementById("backFromLottery").onclick = openWorks;
        document.getElementById("backFromSlider").onclick = openWorks;
        document.getElementById("backFromClock").onclick = openWorks;
        document.getElementById("backFromDraw").onclick = openWorks;
        document.getElementById("backFromColor").onclick = openWorks;
        document.getElementById("drawBtn").onclick = drawPrize;
        document.getElementById("slideBtn").onclick = randomSlide;
        document.getElementById("clearDraw").onclick = function () {
            const pad = document.getElementById("drawPad");
            const p = pad.getContext("2d");
            p.clearRect(0, 0, pad.width, pad.height);
        };
        document.getElementById("colorPick").oninput = showColor;

        function drawPrize() {
            const personArr = ["周杰伦", "刘德华", "周星驰", "Pink老师", "张学友"];
            const randomNum1 = Math.floor(Math.random() * personArr.length);
            document.getElementById("one").innerHTML = personArr[randomNum1];
            personArr.splice(randomNum1, 1);
            const randomNum2 = Math.floor(Math.random() * personArr.length);
            document.getElementById("two").innerHTML = personArr[randomNum2];
            personArr.splice(randomNum2, 1);
            const randomNum3 = Math.floor(Math.random() * personArr.length);
            document.getElementById("three").innerHTML = personArr[randomNum3];
        }

        function randomSlide() {
            const slides = ["粉", "青", "黄", "紫", "绿"];
            const colors = ["#ff8cc8", "#7ae0ff", "#ffe566", "#c9b6ff", "#7cffb2"];
            const n = Math.floor(Math.random() * slides.length);
            const box = document.getElementById("slideBox");
            box.style.background = colors[n];
            box.textContent = "第" + (n + 1) + "张 · " + slides[n];
        }

        function two(n) {
            if (n < 10) {
                return "0" + n;
            }
            return "" + n;
        }
        function tickClock() {
            const now = new Date();
            const s = now.getSeconds();
            const m = now.getMinutes();
            const h = now.getHours();
            document.getElementById("secHand").style.transform = "rotate(" + (s * 6) + "deg)";
            document.getElementById("minHand").style.transform = "rotate(" + (m * 6 + s * 0.1) + "deg)";
            document.getElementById("hourHand").style.transform = "rotate(" + ((h % 12) * 30 + m * 0.5) + "deg)";
            document.getElementById("clockText").textContent = two(h) + ":" + two(m) + ":" + two(s);
        }
        setInterval(tickClock, 1000);
        tickClock();

        function showColor() {
            const hex = document.getElementById("colorPick").value;
            document.getElementById("colorShow").style.background = hex;
            document.getElementById("colorHex").textContent = hex;
        }
        showColor();

        const drawPad = document.getElementById("drawPad");
        const drawCtx = drawPad.getContext("2d");
        let drawing = false;
        let penColor = "#5b2b8a";
        let penSize = 6;
        const sizeBtns = document.querySelectorAll(".size");
        for (let n = 0; n < sizeBtns.length; n = n + 1) {
            sizeBtns[n].onclick = function () {
                penSize = Number(sizeBtns[n].getAttribute("data-size"));
                for (let k = 0; k < sizeBtns.length; k = k + 1) {
                    sizeBtns[k].classList.remove("on");
                }
                sizeBtns[n].classList.add("on");
            };
        }
        const pens = document.querySelectorAll(".pen");
        function pickPen(color) {
            penColor = color;
            document.getElementById("drawColorPick").value = color;
            for (let n = 0; n < pens.length; n = n + 1) {
                if (pens[n].getAttribute("data-color") === color) {
                    pens[n].classList.add("on");
                } else {
                    pens[n].classList.remove("on");
                }
            }
        }
        for (let n = 0; n < pens.length; n = n + 1) {
            pens[n].onclick = function () {
                pickPen(pens[n].getAttribute("data-color"));
            };
        }
        document.getElementById("drawColorPick").oninput = function () {
            penColor = document.getElementById("drawColorPick").value;
            for (let n = 0; n < pens.length; n = n + 1) {
                pens[n].classList.remove("on");
            }
        };
        function padPos(event) {
            const box = drawPad.getBoundingClientRect();
            return {
                x: event.clientX - box.left,
                y: event.clientY - box.top
            };
        }
        drawPad.onmousedown = function (event) {
            drawing = true;
            const p = padPos(event);
            drawCtx.beginPath();
            drawCtx.moveTo(p.x, p.y);
        };
        drawPad.onmousemove = function (event) {
            if (!drawing) {
                return;
            }
            const p = padPos(event);
            drawCtx.strokeStyle = penColor;
            drawCtx.lineWidth = penSize;
            drawCtx.lineCap = "round";
            drawCtx.lineTo(p.x, p.y);
            drawCtx.stroke();
        };
        drawPad.onmouseup = function () {
            drawing = false;
        };
        drawPad.onmouseleave = function () {
            drawing = false;
        };

        const name = document.querySelector(".name");
        const hi = document.querySelector(".hi");
        const colors = [
            "linear-gradient(90deg, #ff8cc8, #7ae0ff)",
            "linear-gradient(90deg, #ffe566, #ff6b9d)",
            "linear-gradient(90deg, #7cffb2, #7ae0ff)"
        ];
        const hellos = ["你好，我是千树！", "上面点「游戏」才出现小游戏", "欢迎来到我的主页"];
        let i = 0;

        name.onclick = function () {
            i = i + 1;
            if (i >= colors.length) {
                i = 0;
            }
            name.style.background = colors[i];
            name.style.backgroundClip = "text";
            name.style.webkitBackgroundClip = "text";
            hi.textContent = hellos[i];
            hi.classList.add("show");
        };

        const cards = document.querySelectorAll(".info");
        for (let n = 0; n < cards.length; n = n + 1) {
            cards[n].onclick = function () {
                cards[n].classList.toggle("on");
            };
        }

        const bubbleColors = ["#ff8cc8", "#7ae0ff", "#ffe566", "#b8fff0", "#c9b6ff"];
        const bubbleArena = document.getElementById("bubbleArena");
        const bubbleScoreEl = document.getElementById("bubbleScore");
        let bubbleScore = 0;

        function gamesOpen() {
            return document.body.classList.contains("play");
        }

        let audio;
        function readySound() {
            if (!audio) {
                audio = new AudioContext();
            }
            if (audio.state === "suspended") {
                audio.resume();
            }
        }
        function playBo() {
            const bo = new Audio("sounds/bo.mp3");
            bo.play();
        }
        function playDing() {
            readySound();
            const t = audio.currentTime;
            const notes = [988, 1319];
            for (let n = 0; n < notes.length; n = n + 1) {
                const o = audio.createOscillator();
                const g = audio.createGain();
                o.type = "triangle";
                o.frequency.value = notes[n];
                g.gain.setValueAtTime(0.16, t + n * 0.06);
                g.gain.exponentialRampToValueAtTime(0.01, t + 0.38 + n * 0.06);
                o.connect(g);
                g.connect(audio.destination);
                o.start(t + n * 0.06);
                o.stop(t + 0.42 + n * 0.06);
            }
        }

        function spawnBubble() {
            if (!gamesOpen()) {
                return;
            }
            const bubble = document.createElement("div");
            bubble.className = "bubble";
            const size = 22 + Math.floor(Math.random() * 22);
            const color = bubbleColors[Math.floor(Math.random() * bubbleColors.length)];
            bubble.style.width = size + "px";
            bubble.style.height = size + "px";
            bubble.style.background = color;
            bubble.style.color = color;
            bubble.style.left = Math.floor(Math.random() * 70) + "%";
            bubble.style.top = "88%";
            bubbleArena.appendChild(bubble);

            let top = 88;
            const timer = setInterval(function () {
                top = top - 0.6;
                bubble.style.top = top + "%";
                if (top < -10 || !gamesOpen()) {
                    clearInterval(timer);
                    bubble.remove();
                }
            }, 50);

            bubble.onclick = function () {
                clearInterval(timer);
                bubble.remove();
                bubbleScore = bubbleScore + 1;
                bubbleScoreEl.textContent = bubbleScore + " 分";
                playBo();
            };
        }

        setInterval(spawnBubble, 2000);

        const starArena = document.getElementById("starArena");
        const paddle = document.getElementById("paddle");
        const starScoreEl = document.getElementById("starScore");
        let starScore = 0;
        let paddleX = 70;

        function putPaddle() {
            paddle.style.left = paddleX + "px";
        }
        putPaddle();

        starArena.onmousemove = function (event) {
            const box = starArena.getBoundingClientRect();
            paddleX = event.clientX - box.left - 28;
            if (paddleX < 0) {
                paddleX = 0;
            }
            if (paddleX > box.width - 56) {
                paddleX = box.width - 56;
            }
            putPaddle();
        };

        function spawnStar() {
            if (!gamesOpen()) {
                return;
            }
            const star = document.createElement("div");
            star.className = "star";
            let y = 0;
            star.style.left = Math.floor(Math.random() * 80) + "%";
            star.style.top = y + "px";
            starArena.appendChild(star);

            const timer = setInterval(function () {
                y = y + 4;
                star.style.top = y + "px";
                const starBox = star.getBoundingClientRect();
                const padBox = paddle.getBoundingClientRect();
                const hit = starBox.bottom >= padBox.top &&
                    starBox.left < padBox.right &&
                    starBox.right > padBox.left;
                if (hit) {
                    clearInterval(timer);
                    star.remove();
                    starScore = starScore + 1;
                    starScoreEl.textContent = starScore + " 分";
                    playDing();
                } else if (y > starArena.clientHeight || !gamesOpen()) {
                    clearInterval(timer);
                    star.remove();
                }
            }, 30);
        }

        setInterval(spawnStar, 900);
    </script>
</body>
</html>
